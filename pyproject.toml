[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memoryforge"
version = "0.1.0"
description = "Customer memory service: ingest conversation events, extract facts, resolve identity, retrieve in milliseconds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "numpy>=1.26",
    "httpx>=0.27",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
kafka = ["confluent-kafka>=2.3"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
memoryforge = "memoryforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
